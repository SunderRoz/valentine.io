<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Valentine App</title>

<style>
html {
    -webkit-text-size-adjust: 100%;
}

body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    margin: 0;
    background: linear-gradient(135deg, #6a0dad, #b266ff);
    overflow: hidden;
}

.container {
    text-align: center;
}

.button {
    padding: 15px 35px;
    font-size: 20px;
    cursor: pointer;
    border: none;
    border-radius: 30px;
    background: linear-gradient(45deg, #ff4ecd, #ff0080);
    color: white;
    box-shadow: 0 0 15px rgba(255,0,128,0.6);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

/* Контейнер */
#heartContainer {
    display: none;
    position: fixed;
    inset: 0;
    justify-content: center;
    align-items: center;
    flex-direction: column;

    padding: env(safe-area-inset-top)
             env(safe-area-inset-right)
             env(safe-area-inset-bottom)
             env(safe-area-inset-left);
}

/* ❤️ СЕРДЦЕ */
.heart {
    position: relative;
    width: 120px;
    height: 120px;
    background: red;
    transform: rotate(-45deg);
    transform-origin: center;

    /* АНИМАЦИЯ БИЕНИЯ */
    animation: heartbeat 1.1s infinite ease-in-out;
    will-change: transform;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 120px;
    height: 120px;
    background: red;
    border-radius: 50%;
}

.heart::before {
    top: -60px;
    left: 0;
}

.heart::after {
    left: 60px;
    top: 0;
}

/* 💓 КЛЮЧЕВАЯ АНИМАЦИЯ */
@keyframes heartbeat {
    0%   { transform: rotate(-45deg) scale(1); }
    14%  { transform: rotate(-45deg) scale(1.12); }
    28%  { transform: rotate(-45deg) scale(1); }
    42%  { transform: rotate(-45deg) scale(1.12); }
    70%  { transform: rotate(-45deg) scale(1); }
    100% { transform: rotate(-45deg) scale(1); }
}

/* Для людей с отключенной анимацией в системе */
@media (prefers-reduced-motion: reduce) {
    .heart {
        animation: none;
    }
}

.message {
    color: white;
    font-size: 26px;
    margin-top: 25px;
    text-align: center;
}
</style>
</head>

<body>

<div class="container" id="buttonContainer">
    <button class="button" id="showBtn">
        Naciśnij na mnie ❤️
    </button>
</div>

<div id="heartContainer">
    <div class="heart"></div>

    <div class="message">
        Miłych Walentynek &lt;3
    </div>
</div>

<script>
document.getElementById("showBtn").addEventListener("click", showHeart);
document.getElementById("showBtn").addEventListener("touchend", showHeart);

function showHeart(e) {
    if (e) e.preventDefault();
    document.getElementById("buttonContainer").style.display = "none";
    document.getElementById("heartContainer").style.display = "flex";
}
</script>

</body>
</html>
